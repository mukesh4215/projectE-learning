<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Sector Not Found | Jnana</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-dark: #050810;
        --glass-bg: rgba(13, 19, 33, 0.6);
        --glass-border: rgba(255, 255, 255, 0.08);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #64ffda;
        --accent-glow: rgba(100, 255, 218, 0.4);
        --alert-bg: rgba(244, 63, 94, 0.15);
        --alert-border: rgba(247, 63, 94, 0.4);
        --alert-text: #fb7185;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Outfit", system-ui, sans-serif;
        background-color: var(--bg-dark);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
      }

      /* Ambient Background Animations */
      body::before, body::after {
        content: '';
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        z-index: -1;
        pointer-events: none;
      }
      
      body::before {
        background: radial-gradient(circle at 20% 40%, rgba(100, 255, 218, 0.08), transparent 30%),
                    radial-gradient(circle at 80% 60%, rgba(59, 130, 246, 0.08), transparent 30%);
        animation: floatGlow 15s ease-in-out infinite alternate;
      }

      /* Grid overlay */
      body::after {
        background-image: 
          linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 40px 40px;
        opacity: 0.5;
        transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
        animation: gridMove 20s linear infinite;
      }

      /* Glassmorphism Header */
      header {
        background: rgba(5, 8, 16, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--glass-border);
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
      }

      .logo {
        font-family: "Outfit", sans-serif;
        font-size: 26px;
        font-weight: 700;
        text-decoration: none;
        color: #fff;
        letter-spacing: 2px;
        display: flex;
        align-items: center;
        gap: 8px;
        text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
      }

      .logo::before {
        content: '🚀';
        font-size: 22px;
      }

      nav {
        display: flex;
        gap: 16px;
      }

      nav a {
        background-color: transparent;
        color: var(--text);
        text-decoration: brown;
        padding: 8px 20px;
        border-radius: 99px;
        font-weight: 500;
        font-size: 14px;
        border: 1px solid var(--glass-border);
        transition: all 0.3s ease;
        letter-spacing: 0.5px;
      }

      nav a:hover {
        background-color: rgba(255, 255, 255, 0.05);
        border-color: var(--accent);
        color: var(--accent);
        box-shadow: 0 0 15px rgba(100, 255, 218, 0.2);
        transform: translateY(-2px);
      }

      .main-content {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
        position: relative;
        z-index: 1;
      }

      /* Main Glass Card */
      .error-container {
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        padding: 60px 40px;
        text-align: center;
        max-width: 550px;
        width: 100%;
        position: relative;
        overflow: hidden;
      }

      .error-container::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 3px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        opacity: 0.6;
      }

      .error-code {
        font-family: 'Fira Code', monospace;
        font-size: 110px;
        font-weight: 700;
        line-height: 1;
        margin-bottom: 20px;
        background: linear-gradient(135deg, #fff 0%, var(--accent) 50%, #3b82f6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 40px rgba(100, 255, 218, 0.3);
        animation: floatObject 4s ease-in-out infinite;
        position: relative;
      }

      .error-container h1 {
        margin-bottom: 16px;
        color: #fff;
        font-size: 32px;
        font-weight: 600;
        letter-spacing: 1px;
      }

      .error-subtitle {
        color: var(--muted);
        margin-bottom: 40px;
        font-size: 16px;
        line-height: 1.6;
        font-weight: 300;
      }

      .error-actions {
        display: flex;
        gap: 20px;
        justify-content: center;
        margin-bottom: 10px;
      }

      .btn {
        padding: 14px 28px;
        border-radius: 99px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        letter-spacing: 1px;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .btn-primary {
        background-color: rgba(100, 255, 218, 0.1);
        color: var(--accent);
        border: 1px solid var(--accent);
        box-shadow: 0 0 15px rgba(100, 255, 218, 0.15);
      }

      .btn-primary:hover {
        background-color: var(--accent);
        color: #050810;
        box-shadow: 0 0 25px rgba(100, 255, 218, 0.4);
        transform: translateY(-3px);
      }

      .btn-secondary {
        background-color: rgba(255, 255, 255, 0.03);
        color: var(--text);
        border: 1px solid var(--glass-border);
      }

      .btn-secondary:hover {
        background-color: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.3);
        transform: translateY(-3px);
      }

      footer {
        background: transparent;
        color: var(--muted);
        text-align: center;
        padding: 20px;
        font-weight: 400;
        font-size: 13px;
        letter-spacing: 1px;
        z-index: 10;
      }

      /* High-Tech HUD Alert */
      .alert {
        position: fixed;
        top: 24px;
        right: 24px;
        padding: 16px 20px;
        border-radius: 12px;
        color: var(--alert-text);
        min-width: 320px;
        z-index: 1000;
        font-weight: 500;
        font-size: 14px;
        background: var(--alert-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--alert-border);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        display: flex;
        align-items: center;
        justify-content: space-between;
        animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
      
      .alert::before {
        content: '⚠️';
        margin-right: 12px;
        font-size: 18px;
      }

      .alert-close {
        background: transparent;
        border: none;
        color: var(--alert-text);
        font-size: 22px;
        cursor: pointer;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        opacity: 0.7;
      }

      .alert-close:hover {
        opacity: 1;
        transform: scale(1.1) rotate(90deg);
      }

      /* Animations */
      @keyframes floatGlow {
        0% { transform: scale(1) translate(0, 0); }
        100% { transform: scale(1.1) translate(2%, 2%); }
      }

      @keyframes floatObject {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
      }

      @keyframes gridMove {
        0% { background-position: 0 0; }
        100% { background-position: 0 40px; }
      }

      @keyframes slideIn {
        from { transform: translateX(120%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
    </style>
  </head>

  <body>
    <!-- Alert Container -->
    <div class="alert" id="errorAlert" style="display: none">
      <span style="flex:1">Anomaly detected: Sector not found.</span>
      <button class="alert-close" onclick="closeAlert('errorAlert')">
        &times;
      </button>
    </div>

    <!-- Header -->
    <header>
      <a href="/" class="logo">Jnana</a>
      <nav>
        <a href="/login">Initialize Login</a>
        <a href="/register">Register</a>
      </nav>
    </header>

    <div class="main-content">
      <div class="error-container">
        <div class="error-code">404</div>
        <h1>Void Encountered</h1>
        <p class="error-subtitle">
          The coordinate you're attempting to reach does not exist within the current registry or has been relocated.
        </p>

        <div class="error-actions">
          <a href="/" class="btn btn-primary">
            <span>Return to Base</span>
          </a>
          <button onclick="history.back()" class="btn btn-secondary">
            <span>Reverse Trajectory</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer>&copy; 2026 Jnana Nexus. All systems operational.</footer>

    <script>
      function closeAlert(alertId) {
        const alertEl = document.getElementById(alertId);
        alertEl.style.opacity = '0';
        alertEl.style.transform = 'translateX(120%)';
        alertEl.style.transition = 'all 0.4s ease';
        setTimeout(() => {
          alertEl.style.display = "none";
        }, 400);
      }

      // Show error alert after page loads
      setTimeout(function () {
        document.getElementById("errorAlert").style.display = "flex";
      }, 800);

      // Auto hide alert after 6 seconds
      setTimeout(function () {
        var errorAlert = document.getElementById("errorAlert");
        if (errorAlert && errorAlert.style.display !== "none") {
          closeAlert("errorAlert");
        }
      }, 6000);
    </script>
  </body>
</html>
